# Sample workflow for building and deploying a website to GitHub Pages
name: Deploy Pages

on:
  # Runs on pushes targeting the default branch and c4 files
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_call:    
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  
# Allow only one concurrent deployment, skipping runs queued between the run in progress and the latest queued.
# However, do NOT cancel in-progress runs, as we want to allow these production deployments to be completed.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Validate model following our rules
  # @see test/validate-model.spec.ts
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Validate
        run: npm run test

  # Build job
  #
  # Runs likec4 from this repo's lockfile (npm ci) rather than the likec4/actions
  # docker image: the image ships Playwright browsers matching its own bundled
  # likec4, so pinning a different likec4 version there breaks PNG export.
  # With the lockfile as the single version source, Renovate PRs control upgrades.
  build-pages:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # resolves to the playwright version likec4 pins in the lockfile,
        # so the browsers always match
        run: npx playwright install --with-deps chromium

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Build
        # base path required if you don't set a custom domain for the repository
        # https://docs.github.com/en/pages/getting-started-with-github-pages/about-github-pages#types-of-github-pages-sites
        run: npx likec4 build -o dist --base "${{ steps.pages.outputs.base_path }}"

      - name: Export diagrams
        run: npx likec4 export png -o dist/images --use-dot

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Deployment job
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
